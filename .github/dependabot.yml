# Dependabot configuration.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# Tuned per GitHub's "tame Dependabot" guidance: batch version updates into a
# few grouped PRs on a slow (monthly) cadence, with a release cooldown. Security
# updates ignore groups/schedule and still open immediately.

version: 2
updates:
  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # Minor+patch land together; majors are grouped separately so one breaking
    # bump can't wedge the routine batch.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
    # Wait a few days after a release before opening a version-update PR, so a
    # compromised fresh release has time to be flagged.
    cooldown:
      default-days: 7
