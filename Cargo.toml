[package]
name = "chopper"
version = "0.14.1"
authors = ["wdecoster <decosterwouter@gmail.com>"]
edition = "2021"
license = "MIT"
description = "A tool to filter fastq files"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5"
rayon = "1.12.0"
minimap2 = { version = "0.1.31", default-features = false }
flate2 = { version = "1.1.9", features = [
    "zlib-rs",
], default-features = false }
xz2 = "0.1.7"
bzip2 = "0.6.0"
noodles-bam = "0.97"
noodles-sam = "0.92"
noodles-bgzf = "0.52"

[profile.release]
# Whole-program optimization for the release binary. Slower to compile, but
# produces a meaningfully faster binary for this CPU-bound workload.
lto = "fat"
codegen-units = 1

[dev-dependencies]
sha2 = "0.11.1"
